name: E2E

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'e2e/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      BASE_URL: http://127.0.0.1:4173
      API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Start PHP backend
        run: |
          php -S 127.0.0.1:8000 -t backend/public &>> /tmp/backend.log &
          echo "BACKEND_PID=$!" >> $GITHUB_ENV

      - name: Wait for backend /health
        run: npx wait-on http://127.0.0.1:8000/health --timeout 30000

      - name: Start frontend preview
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 &>> /tmp/frontend.log &
        working-directory: frontend

      - name: Wait for frontend
        run: npx wait-on http://127.0.0.1:4173 --timeout 30000

      - name: Run Playwright tests
        run: npx playwright test
        env:
          BASE_URL: ${{ env.BASE_URL }}
          API_URL: ${{ env.API_URL }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            /tmp/backend.log
            /tmp/frontend.log
          retention-days: 7
